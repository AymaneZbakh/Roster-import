name: Automated RAM Roster Sync

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Browser Dependencies
      run: |
        pip install playwright
        playwright install chromium

    - name: Run Automated Browser Login
      env:
        CREW_USER: ${{ secrets.RAM_USER }}
        CREW_PASS: ${{ secrets.RAM_PASS }}
      run: |
        python - <<EOF
        import os
        import json
        from playwright.sync_api import sync_playwright

        username = os.environ.get("CREW_USER")
        password = os.environ.get("CREW_PASS")

        with sync_playwright() as p:
            print("Launching automated browser...")
            browser = p.chromium.launch(headless=True)
            page = browser.new_page()

            roster_data = None
            def handle_response(response):
                global roster_data
                if "/crew/roster/v1" in response.url and response.status == 200:
                    try:
                        roster_data = response.json()
                        print("🎯 Intercepted roster JSON data payload.")
                    except Exception:
                        pass

            page.on("response", handle_response)

            print("Navigating to RAM CrewAccess...")
            page.goto("https://crewaccess.ram.jepphost.com/access/crewweb/")

            # Wait for either standard login box or the ADFS login box
            print("Waiting for login input fields...")
            page.wait_for_selector("input[id*='userNameInput'], input[type='text'], input[name='username']", timeout=45000)
            
            # Fill username and password using standard or ADFS selectors
            if page.locator("input[id*='userNameInput']").is_visible():
                page.fill("input[id*='userNameInput']", username)
                page.fill("input[id*='passwordInput']", password)
                print("Submitting ADFS login credentials...")
                page.click("span[id*='submitButton'], input[type='submit']")
            else:
                page.fill("input[type='text'], input[name='username']", username)
                page.fill("input[type='password']", password)
                print("Submitting standard login credentials...")
                page.click("button[type='submit'], input[type='submit']")

            # Wait for data request to finish
            print("Waiting for roster data to sync...")
            page.wait_for_timeout(15000) 

            if roster_data:
                with open("roster.json", "w") as f:
                    json.dump(roster_data, f, indent=2)
                print("Saved roster.json.")
            else:
                print("Failed to catch data payload.")
                exit(1)
                
            browser.close()
        EOF

    - name: Commit and Update GitHub Pages
      run: |
        git config --global user.name "Roster Automation Bot"
        git config --global user.email "bot@github.actions"
        git add roster.json
        if git diff --staged --quiet; then
          echo "No changes detected. Skipping commit."
        else
          git commit -m "🔄 Automated Schedule Update [Skip CI]"
          git push
        fi
