name: Automated RAM Roster Sync
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Browser Dependencies
      run: |
        pip install playwright requests cryptography
        playwright install chromium

    - name: Decrypt last run's roster (runner-local only, never committed)
      env:
        ROSTER_PASSPHRASE: ${{ secrets.ROSTER_PASSPHRASE }}
      run: |
        if [ -f roster.enc.json ]; then
          python scripts/decrypt_roster.py roster.enc.json roster.json
        else
          echo "No roster.enc.json yet — first run."
        fi

    - name: Pre-check — Detect Roster Change
      id: precheck
      env:
        CREW_USER: ${{ secrets.RAM_USER }}
        CREW_PASS: ${{ secrets.RAM_PASS }}
      run: |
        python - <<EOF
        import os
        import json
        import hashlib
        import requests

        username = os.environ.get("CREW_USER")
        password = os.environ.get("CREW_PASS")

        session = requests.Session()
        session.headers.update({"User-Agent": "Mozilla/5.0"})

        print("Attempting lightweight login for pre-check...")
        try:
            login_resp = session.post(
                "https://crewaccess.ram.jepphost.com/access/crewweb/api/login",
                json={"username": username, "password": password},
                timeout=20
            )
        except requests.exceptions.RequestException as e:
            print(f"Pre-check request failed ({e}). Proceeding to full sync.")
            with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                f.write("changed=true\n")
            exit(0)

        if login_resp.status_code not in (200, 201):
            print("Pre-check login failed (likely ADFS). Proceeding to full sync.")
            with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                f.write("changed=true\n")
            exit(0)

        roster_resp = session.get(
            "https://crewaccess.ram.jepphost.com/access/crewweb/crew/roster/v1",
            timeout=20
        )

        if roster_resp.status_code != 200:
            print("Pre-check roster fetch failed. Proceeding to full sync.")
            with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                f.write("changed=true\n")
            exit(0)

        new_hash = hashlib.md5(roster_resp.content).hexdigest()
        print(f"Remote roster hash: {new_hash}")

        try:
            with open("roster.json", "rb") as f:
                old_hash = hashlib.md5(f.read()).hexdigest()
            print(f"Local roster hash:  {old_hash}")
        except FileNotFoundError:
            old_hash = ""
            print("No local roster.json found. Will do full sync.")

        changed = new_hash != old_hash
        print(f"Roster changed: {changed}")
        with open(os.environ["GITHUB_OUTPUT"], "a") as f:
            f.write(f"changed={'true' if changed else 'false'}\n")
        EOF

    - name: Save previous roster for comparison
      if: steps.precheck.outputs.changed == 'true'
      run: cp roster.json roster_old.json 2>/dev/null || echo "No previous roster.json yet."

    - name: Run Automated Browser Login
      if: steps.precheck.outputs.changed == 'true'
      env:
        CREW_USER: ${{ secrets.RAM_USER }}
        CREW_PASS: ${{ secrets.RAM_PASS }}
      run: |
        python - <<EOF
        import os
        import json
        from playwright.sync_api import sync_playwright

        username = os.environ.get("CREW_USER")
        password = os.environ.get("CREW_PASS")

        with sync_playwright() as p:
            print("Launching automated browser...")
            browser = p.chromium.launch(headless=True)
            page = browser.new_page()

            print("Navigating to RAM CrewAccess...")
            page.goto("https://crewaccess.ram.jepphost.com/access/crewweb/")

            print("Waiting for login input fields...")
            page.wait_for_selector(
                "input[id*='userNameInput'], input[type='text'], input[name='username']",
                timeout=45000
            )

            is_adfs = page.locator("input[id*='userNameInput']").is_visible()

            if is_adfs:
                page.fill("input[id*='userNameInput']", username)
                page.fill("input[id*='passwordInput']", password)
                print("Submitting ADFS login credentials...")
                with page.expect_response(
                    lambda r: "/crew/roster/v1" in r.url and r.status == 200,
                    timeout=60000
                ) as response_info:
                    page.click("span[id*='submitButton'], input[type='submit']")
            else:
                page.fill("input[type='text'], input[name='username']", username)
                page.fill("input[type='password']", password)
                print("Submitting standard login credentials...")
                with page.expect_response(
                    lambda r: "/crew/roster/v1" in r.url and r.status == 200,
                    timeout=60000
                ) as response_info:
                    page.click("button[type='submit'], input[type='submit']")

            print("Waiting for roster API response...")
            response = response_info.value

            if response.ok:
                roster_data = response.json()
                with open("roster.json", "w") as f:
                    json.dump(roster_data, f, indent=2)
                print("✅ Saved roster.json successfully.")
            else:
                print(f"❌ Roster API returned status {response.status}")
                exit(1)

            browser.close()
        EOF

    - name: Detect roster changes and send alert
      if: steps.precheck.outputs.changed == 'true'
      env:
        NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      run: python detect_changes.py

    - name: Regenerate calendar feed (local, temporary file only)
      if: steps.precheck.outputs.changed == 'true'
      run: python export_ical.py
      # writes to ./roster_local.ics — never committed, see .gitignore.
      # It exists only so the next step can read it and push it to a
      # secret Gist. It is NOT the same thing as a public repo file with
      # a random name: a public repo's file listing exposes every
      # filename regardless of how random it is, which is why the old
      # "unguessable filename in the repo" approach didn't actually work.

    - name: Publish calendar to secret Gist
      if: steps.precheck.outputs.changed == 'true'
      env:
        GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        GIST_ID: ${{ secrets.GIST_ID }}
      run: python scripts/publish_ics_gist.py roster_local.ics

    - name: Encrypt roster before it ever touches git
      if: steps.precheck.outputs.changed == 'true'
      env:
        ROSTER_PASSPHRASE: ${{ secrets.ROSTER_PASSPHRASE }}
      run: python scripts/encrypt_roster.py roster.json roster.enc.json

    - name: Commit and Update GitHub Pages
      if: steps.precheck.outputs.changed == 'true'
      run: |
        rm -f roster.json roster_old.json roster_local.ics
        git config --global user.name "Roster Automation Bot"
        git config --global user.email "bot@github.actions"
        # ONLY the encrypted roster is committed now. The calendar feed
        # lives in a secret Gist (previous step), never in this repo —
        # a public repo can't hide a filename, no matter how random it is.
        git add roster.enc.json
        if git diff --staged --quiet; then
          echo "No changes detected. Skipping commit."
        else
          git commit -m "🔄 Automated Schedule Update [Skip CI]"
          git push
        fi
