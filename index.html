<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAM Roster Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <style>
    :root {
      --ram-red: #c8102e;
      --ram-red-dim: rgba(200,16,46,0.12);
      --ram-red-glow: rgba(200,16,46,0.25);
      --bg: #0d0f12;
      --bg-card: #13161b;
      --bg-hover: #181c22;
      --bg-input: #1a1e25;
      --border: rgba(255,255,255,0.07);
      --border-active: rgba(255,255,255,0.14);
      --text: #e8eaf0;
      --text-2: #8b909d;
      --text-3: #555b68;
      --blue: #4a9eff;
      --blue-dim: rgba(74,158,255,0.12);
      --green: #5db87a;
      --green-dim: rgba(93,184,122,0.12);
      --amber: #e8a840;
      --amber-dim: rgba(232,168,64,0.12);
      --mono: 'DM Mono', monospace;
      --sans: 'Syne', sans-serif;
      --r: 8px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
    }

    /* Gatekeeper Protection Screen */
    .pin-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .pin-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 2.5rem 2rem;
      border-radius: 12px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    .pin-box .logo-container {
      width: 100%;
      max-width: 220px;
      height: auto;
      margin: 0 auto 1.5rem;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .pin-box .logo-container img {
      width: 100%;
      height: auto;
      object-fit: contain;
    }

    .pin-box h2 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 6px;
      letter-spacing: -0.3px;
    }

    .pin-box p {
      font-size: 12px;
      color: var(--text-2);
      margin-bottom: 1.5rem;
    }

    .pin-input-wrapper {
      position: relative;
      margin-bottom: 1.5rem;
    }

    .pin-input-wrapper input {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border-active);
      border-radius: var(--r);
      padding: 12px;
      color: white;
      font-family: var(--mono);
      font-size: 18px;
      letter-spacing: 6px;
      text-align: center;
      outline: none;
    }

    .pin-input-wrapper input:focus {
      border-color: var(--ram-red);
    }

    .pin-box .error-msg {
      color: #e24b4a;
      font-size: 11px;
      font-family: var(--mono);
      margin-top: -12px;
      margin-bottom: 16px;
    }

    /* Keypad Layout */
    .numpad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 1.5rem;
    }

    .numpad-btn {
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--r);
      color: var(--text);
      font-family: var(--mono);
      font-size: 18px;
      font-weight: 500;
      padding: 14px 0;
      cursor: pointer;
      user-select: none;
      transition: all 0.1s ease;
    }

    .numpad-btn:active {
      background: var(--bg-hover);
      border-color: var(--text-3);
      transform: scale(0.96);
    }

    .numpad-btn.action-btn {
      background: rgba(255, 255, 255, 0.03);
      font-size: 14px;
      color: var(--text-2);
    }

    .pin-btn {
      width: 100%;
      background: var(--ram-red);
      color: white;
      border: none;
      border-radius: var(--r);
      padding: 13px;
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 0 15px var(--ram-red-glow);
    }

    /* Main Workspace Elements */
    .app {
      position: relative;
      z-index: 1;
      max-width: 860px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
      display: none;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }

    .header-logo-container {
      width: 130px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .header-logo-container img {
      width: 100%;
      height: auto;
      object-fit: contain;
    }

    .header-text h1 {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
    }

    .header-text p {
      font-size: 12px;
      color: var(--text-2);
      font-family: var(--mono);
      margin-top: 2px;
    }

    .btn {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-family: var(--sans);
      font-size: 12px;
      padding: 7px 14px;
      border-radius: var(--r);
      border: 1px solid var(--border-active);
      background: var(--bg-card);
      color: var(--text-2);
      cursor: pointer;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 1.5rem;
    }

    .stat {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 14px 16px;
    }

    .stat-label {
      font-size: 10px;
      color: var(--text-3);
      text-transform: uppercase;
      font-family: var(--mono);
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 26px;
      font-weight: 700;
      font-family: var(--mono);
    }

    .filters {
      display: flex;
      gap: 6px;
      margin-bottom: 1.25rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .filters-label {
      font-size: 11px;
      color: var(--text-3);
      font-family: var(--mono);
    }

    .filter-btn {
      font-family: var(--sans);
      font-size: 12px;
      padding: 5px 13px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-2);
      cursor: pointer;
    }

    .filter-btn.active { background: var(--ram-red); color: white; border-color: transparent; }

    .select-month {
      background: var(--bg-card);
      border: 1px solid var(--border-active);
      color: var(--text-2);
      font-size: 12px;
      padding: 5px 12px;
      border-radius: 20px;
      outline: none;
      margin-left: auto;
    }

    .activity-list { display: flex; flex-direction: column; gap: 8px; }

    .activity-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px 16px;
      cursor: pointer;
    }

    .type-badge {
      font-size: 9px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      font-family: var(--mono);
    }
    .badge-flight   { background: var(--blue-dim); color: var(--blue); }
    .badge-standby  { background: var(--amber-dim); color: var(--amber); }
    .badge-training { background: var(--green-dim); color: var(--green); }
    .badge-other    { background: rgba(255,255,255,0.06); color: var(--text-2); }

    .card-date { font-size: 12px; font-family: var(--mono); color: var(--text-2); min-width: 60px; }
    .card-route { font-size: 14px; font-weight: 600; flex: 1; }
    .card-time { font-size: 11px; color: var(--text-3); font-family: var(--mono); }
    .card-chevron { font-size: 16px; color: var(--text-3); transition: transform .2s; }
    .card-chevron.open { transform: rotate(180deg); }

    .card-body { border-top: 1px solid var(--border); padding: 16px; display: none; }
    .card-body.open { display: block; }

    .detail-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
    .detail-item label { font-size: 10px; color: var(--text-3); text-transform: uppercase; display: block; margin-bottom: 4px; font-family: var(--mono); }
    .detail-item span { font-size: 13px; font-family: var(--mono); }

    .section-label { font-size: 10px; color: var(--text-3); text-transform: uppercase; font-family: var(--mono); margin: 14px 0 8px; }
    .timeline { display: flex; flex-direction: column; gap: 4px; }
    .tl-row { display: grid; grid-template-columns: 88px 1fr auto; gap: 12px; padding: 10px 12px; background: var(--bg); border-radius: 6px; border-left: 2px solid transparent; }
    .flight-row  { border-color: var(--ram-red); }
    .layover-row { border-color: var(--blue); }
    .gt-row      { border-color: var(--green); }

    .tl-type { font-size: 10px; color: var(--text-3); font-family: var(--mono); }
    .tl-label { font-size: 13px; font-weight: 600; }
    .tl-sublabel { font-size: 11px; color: var(--text-2); font-family: var(--mono); margin-top: 3px; }
    .tl-time { font-size: 11px; color: var(--text-3); font-family: var(--mono); text-align: right; }

    .fn-tag { font-size: 11px; font-weight: 600; color: var(--ram-red); font-family: var(--mono); }

    .crew-grid { display: flex; flex-direction: column; gap: 5px; margin-top: 8px; }
    .crew-pill { display: flex; align-items: center; gap: 9px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--r); padding: 6px 10px; }
    .crew-avatar { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 600; font-family: var(--mono); }
    .av-cdb { background: rgba(74,158,255,0.2); color: var(--blue); }
    .av-opl { background: rgba(93,184,122,0.2); color: var(--green); }
    .av-other { background: rgba(255,255,255,0.08); color: var(--text-2); }
    .crew-name { font-size: 12px; }
    .crew-meta { font-size: 10px; color: var(--text-3); font-family: var(--mono); }

    /* Next Flight Global Pulse Highlight Layout */
    .activity-card.next-flight-highlight {
      border-color: #e8a840 !important;
      background: linear-gradient(135deg, #13161b 0%, #1e1708 100%) !important;
      box-shadow: 0 0 18px rgba(232,168,64,0.15);
      position: relative;
    }
    .activity-card.next-flight-highlight::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, #e8a840, transparent);
    }
    .next-flight-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 9px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(232,168,64,0.15);
      color: #e8a840;
      border: 1px solid rgba(232,168,64,0.2);
      font-family: var(--mono);
      animation: flash 2s infinite ease-in-out;
    }
    @keyframes flash { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

    .countdown-timer {
      font-size: 11px;
      font-family: var(--mono);
      color: #e8a840;
      font-weight: 600;
      background: rgba(0,0,0,0.2);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .empty-state { text-align: center; padding: 5rem 1rem; color: var(--text-3); }
    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .hidden { display: none !important; }

    .card-select-cb {
      width: 16px; height: 16px;
      border-radius: 4px;
      border: 1.5px solid var(--border-active);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .activity-card.selected { border-color: var(--ram-red); background: rgba(200,16,46,0.02); }
    .activity-card.selected .card-select-cb { background: var(--ram-red); border-color: var(--ram-red); }
    .card-select-cb i { font-size: 11px; color: white; opacity: 0; }
    .activity-card.selected .card-select-cb i { opacity: 1; }

    .selection-bar {
      position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
      z-index: 100; display: flex; align-items: center; gap: 10px;
      background: var(--bg-card); border: 1px solid var(--border-active);
      border-radius: 12px; padding: 10px 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    }
    .selection-bar.invisible { display: none; }
    .btn-sel { padding: 6px 12px; border-radius: var(--r); border: none; font-size: 12px; font-weight: 600; cursor: pointer; }
    .btn-sel-csv { background: var(--green-dim); color: var(--green); }
    .btn-sel-ical { background: var(--blue-dim); color: var(--blue); }

    .totals-bar { display: flex; gap: 20px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--r); padding: 12px 16px; margin-top: 12px; }
    .totals-item { display: flex; gap: 6px; font-family: var(--mono); font-size: 13px; }
    .totals-label { font-size: 10px; color: var(--text-3); text-transform: uppercase; }
  </style>
</head>
<body>

  <div id="pinOverlay" class="pin-overlay">
    <div class="pin-box">
      <div class="logo-container">
        <img src="https://worldvectorlogo.com/download/royal-air-maroc-logo.svg" alt="Royal Air Maroc" onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/thumb/c/c4/Royal_Air_Maroc_Logo.svg/320px-Royal_Air_Maroc_Logo.svg.png'">
      </div>
      <h2>Secure Access</h2>
      <p>Enter the gatekeeper decryption pass key.</p>
      
      <div class="pin-input-wrapper">
        <input type="password" id="pinInput" maxlength="6" placeholder="•••••" readonly>
      </div>
      
      <div id="errorMsg" class="error-msg hidden">Decryption footprint failure. Access Denied.</div>
      
      <div class="numpad-grid">
        <button class="numpad-btn" onclick="pressKey('1')">1</button>
        <button class="numpad-btn" onclick="pressKey('2')">2</button>
        <button class="numpad-btn" onclick="pressKey('3')">3</button>
        <button class="numpad-btn" onclick="pressKey('4')">4</button>
        <button class="numpad-btn" onclick="pressKey('5')">5</button>
        <button class="numpad-btn" onclick="pressKey('6')">6</button>
        <button class="numpad-btn" onclick="pressKey('7')">7</button>
        <button class="numpad-btn" onclick="pressKey('8')">8</button>
        <button class="numpad-btn" onclick="pressKey('9')">9</button>
        <button class="numpad-btn action-btn" onclick="pressClear()">C</button>
        <button class="numpad-btn" onclick="pressKey('0')">0</button>
        <button class="numpad-btn action-btn" onclick="pressDelete()"><i class="ti ti-backspace"></i></button>
      </div>
      
      <button class="pin-btn" onclick="verifyPinCode()">Unlock Environment</button>
    </div>
  </div>

  <div class="app" id="appContainer">
    <div class="header">
      <div class="header-logo-container">
        <img src="https://worldvectorlogo.com/download/royal-air-maroc-logo.svg" alt="Royal Air Maroc" onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/thumb/c/c4/Royal_Air_Maroc_Logo.svg/320px-Royal_Air_Maroc_Logo.svg.png'">
      </div>
      <div class="header-text">
        <h1>RAM Crew Analytics Workspace</h1>
        <p id="crewLabel">Sync Status: Offline</p>
      </div>
      <button class="btn" id="refreshBtn" onclick="refreshRoster()"><i class="ti ti-refresh"></i>Refresh</button>
    </div>

    <div class="stats-grid" id="statsGrid">
      <div class="stat"><div class="stat-label">Flights</div><div class="stat-value" id="statFlights">0</div></div>
      <div class="stat"><div class="stat-label">Duties</div><div class="stat-value" id="statDuties">0</div></div>
      <div class="stat"><div class="stat-label">Reserve</div><div class="stat-value" id="statStandby">0</div></div>
      <div class="stat"><div class="stat-label">Training</div><div class="stat-value" id="statTraining">0</div></div>
    </div>

    <div id="filterBar" class="filters">
      <span class="filters-label">Show:</span>
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="flight">Flights</button>
      <button class="filter-btn" data-filter="standby">Reserve</button>
      <button class="filter-btn" data-filter="training">Training</button>
      
      <select id="monthSelect" class="select-month">
        <option value="all">All Months</option>
      </select>
    </div>

    <div id="activityList" class="activity-list">
      <div class="empty-state" id="loadingState">
        <i class="ti ti-loader spin"></i>
        <p>Synchronizing Live Roster File</p>
      </div>
    </div>

    <div id="totalsBar" class="totals-bar">
      <span class="totals-label">Totals</span>
      <div class="totals-item"><span id="totHours" style="font-weight:700;">—</span><span>Block hrs</span></div>
      <div class="totals-item"><span id="totFlights" style="font-weight:700;">—</span><span>Flights</span></div>
    </div>

    <div id="selectionBar" class="selection-bar invisible">
      <button class="btn-sel btn-sel-ical" onclick="exportSelectedIcal()">Export Selected iCal</button>
      <button class="btn-sel btn-sel-csv" onclick="exportSelectedCsv()">Export Selected CSV</button>
      <button class="btn-sel" style="background:transparent; color:var(--text-3);" onclick="clearSelection()">Clear</button>
    </div>
  </div>

  <script>
    const pinInput = document.getElementById('pinInput');
    const errorMsg = document.getElementById('errorMsg');
    const pinOverlay = document.getElementById('pinOverlay');
    const appContainer = document.getElementById('appContainer');
    const activityList = document.getElementById('activityList');
    const totalsBar = document.getElementById('totalsBar');
    const selectionBar = document.getElementById('selectionBar');
    const monthSelect = document.getElementById('monthSelect');

    let allCards = [];
    let selectedIds = new Set();
    let cardIdCounter = 0;
    let currentFilter = 'all';
    let currentMonthFilter = 'all';
    let countdownInterval = null;

    // Numerical keypad events input logic
    function pressKey(num) { errorMsg.classList.add('hidden'); if(pinInput.value.length < 6) pinInput.value += num; }
    function pressDelete() { errorMsg.classList.add('hidden'); pinInput.value = pinInput.value.slice(0, -1); }
    function pressClear() { errorMsg.classList.add('hidden'); pinInput.value = ''; }

    // SHA-256 Gatekeeper Protection Code footprint tracking verification
    const CORRECT_PIN_HASH = "599d1db9da4631903b0c74ea64d598dead94905690b47ef7b03ed2c6a470de3c";
    async function hashPin(pin) {
      const encoder = new TextEncoder(); const data = encoder.encode(pin);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function verifyPinCode() {
      if (await hashPin(pinInput.value) === CORRECT_PIN_HASH) {
        pinOverlay.classList.add('hidden');
        appContainer.style.display = 'block';
        initializeRosterSync();
      } else {
        errorMsg.classList.remove('hidden'); pinInput.value = '';
      }
    }

    // Initialization listeners for action filters
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active'); currentFilter = btn.dataset.filter; renderFiltered();
      });
    });
    monthSelect.addEventListener('change', (e) => { currentMonthFilter = e.target.value; renderFiltered(); });

    function toggleCard(bodyEl, chevEl) { bodyEl.classList.toggle('open'); chevEl.classList.toggle('open'); }
    
    function toggleSelect(event, cardId, cardEl) {
      event.stopPropagation();
      if(selectedIds.has(cardId)) { selectedIds.delete(cardId); cardEl.classList.remove('selected'); }
      else { selectedIds.add(cardId); cardEl.classList.add('selected'); }
      selectionBar.classList.toggle('invisible', selectedIds.size === 0);
    }
    
    function clearSelection() {
      selectedIds.clear(); document.querySelectorAll('.activity-card').forEach(c => c.classList.remove('selected'));
      selectionBar.classList.add('invisible');
    }

    function classifyActivity(act) {
      const subs = act.activities || []; if(subs.some(s => s.type === 'flight-leg')) return 'flight';
      const code = (act.activityCode?.id || '').toUpperCase();
      if(code.startsWith('RSR') || code.startsWith('SBY') || code.includes('STB')) return 'standby';
      if(code.startsWith('SIM') || code.startsWith('TRN') || code.includes('INST')) return 'training';
      return 'other';
    }

    // Parsing helpers
    function fmtDate(iso) { if(!iso) return '--'; const d = new Date(iso); const M = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return d.getUTCDate().toString().padStart(2,'0') + ' ' + M[d.getUTCMonth()]; }
    function fmtTime(iso) { if(!iso) return '--'; const d = new Date(iso); return d.getUTCHours().toString().padStart(2,'0') + ':' + d.getUTCMinutes().toString().padStart(2,'0'); }
    function fmtDateTime(iso) { if(!iso) return '--'; return fmtDate(iso) + ' ' + fmtTime(iso); }
    function fmtDuration(mins) { if(!mins) return '0:00h'; return Math.floor(mins/60) + ':' + (mins%60).toString().padStart(2,'0') + 'h'; }

    async function initializeRosterSync() {
      try {
        const response = await fetch('roster.json');
        if (response.ok) { renderRoster(await response.json()); }
        else { document.getElementById('activityList').innerHTML = '<div class="empty-state"><p>Roster context file missing</p></div>'; }
      } catch { document.getElementById('activityList').innerHTML = '<div class="empty-state"><p>Sync failed error layer</p></div>'; }
    }

    function renderRoster(data) {
      const entity = data.entity || data; const activities = entity.activities || [];
      document.getElementById('crewLabel').textContent = `Crew ID: ${entity.crewId || 'RAM'} · Total Operations: ${activities.length}`;
      
      allCards = []; const uniqueMonths = new Set();
      const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];

      // Process raw metrics
      activities.forEach(act => {
        const type = classifyActivity(act);
        const actDate = new Date(act.startTime);
        const monthKey = actDate.getUTCFullYear() + '-' + (actDate.getUTCMonth()+1).toString().padStart(2,'0');
        uniqueMonths.add(JSON.stringify({key: monthKey, label: monthNames[actDate.getUTCMonth()] + ' ' + actDate.getUTCFullYear()}));

        const subs = act.activities || []; const legs = subs.filter(s => s.type === 'flight-leg');
        const blockMins = legs.reduce((acc, l) => acc + (l.blockTimeMinutes || l.durationMinutes || 0), 0);
        let routeText = act.startStation + ' → ' + act.endStation;
        if (legs.length > 1) { routeText = legs.map(l => l.startStation).join(' → ') + ' → ' + legs[legs.length-1].endStation; }

        let timelineHTML = '<div class="section-label">Timeline Details</div><div class="timeline">';
        subs.forEach(s => {
          if(s.type === 'flight-leg') {
            const fn = (s.carrier||'') + (s.flightNumber || '');
            timelineHTML += `
              <div class="tl-row flight-row">
                <div class="tl-type"><span class="fn-tag">${fn}</span><br>${s.aircraftType||''}</div>
                <div><div class="tl-label">${s.startStation} → ${s.endStation}</div><div class="tl-sublabel">Block: ${fmtDuration(s.blockTimeMinutes)}</div></div>
                <div class="tl-time">${fmtTime(s.startTime)}<br>${fmtTime(s.endTime)}</div>
              </div>`;
          } else {
            timelineHTML += `
              <div class="tl-row gt-row">
                <div class="tl-type">${s.activityCode?.id || s.type}</div>
                <div><div class="tl-label">${s.startStation}</div><div class="tl-sublabel">${s.activityCode?.description || ''}</div></div>
                <div class="tl-time">${fmtTime(s.startTime)}<br>${fmtTime(s.endTime)}</div>
              </div>`;
          }
        });
        timelineHTML += '</div>';

        const badgeClass = { flight:'badge-flight', standby:'badge-standby', training:'badge-training', other:'badge-other' }[type];
        // Enforced explicit structural naming constraints
        const badgeLabel = { flight:'Flight', standby:'Reserve', training:'Training', other:'Duty' }[type];

        const cardId = ++cardIdCounter;
        const card = document.createElement('div');
        card.className = 'activity-card';
        card.dataset.id = cardId;

        card.innerHTML = `
          <div class="card-header" onclick="toggleCard(this.nextElementSibling, this.querySelector('.card-chevron'))">
            <div class="card-select-cb" onclick="toggleSelect(event, ${cardId}, this.parentElement.parentElement)"><i class="ti ti-check"></i></div>
            <span class="type-badge ${badgeClass}">${badgeLabel}</span>
            <span class="card-date">${fmtDate(act.startTime)}</span>
            <div class="card-route">${routeText}</div>
            <div class="card-time">${fmtTime(act.startTime)}–${fmtTime(act.endTime)}</div>
            <i class="ti ti-chevron-down card-chevron"></i>
          </div>
          <div class="card-body">
            <div class="detail-grid">
              <div class="detail-item"><label>Report Time</label><span>${fmtDateTime(act.startTime)}</span></div>
              <div class="detail-item"><label>Release Time</label><span>${fmtDateTime(act.endTime)}</span></div>
              <div class="detail-item"><label>Duration</label><span>${fmtDuration(act.durationMinutes)}</span></div>
            </div>
            ${timelineHTML}
          </div>
        `;

        allCards.push({ el: card, act, type, month: monthKey, startTime: new Date(act.startTime).getTime(), durationMinutes: act.durationMinutes, blockMinutes: blockMins });
      });

      // Build Month Selector options layout automatically
      Array.from(uniqueMonths).map(m => JSON.parse(m)).sort((a,b)=>a.key.localeCompare(b.key)).forEach(m => {
        const opt = document.createElement('option'); opt.value = m.key; opt.textContent = m.label; monthSelect.appendChild(opt);
      });

      // Automatically determine and isolate the absolute NEXT FLIGHT from current system time matrix
      calculateAndHighlightNextFlight();
      renderFiltered();
    }

    function calculateAndHighlightNextFlight() {
      if (countdownInterval) clearInterval(countdownInterval);
      const now = Date.now();
      
      // Filter out upcoming flight structural events exclusively
      const upcomingFlights = allCards.filter(c => c.type === 'flight' && c.startTime > now);
      
      if (upcomingFlights.length > 0) {
        // Find the earliest starting item
        upcomingFlights.sort((a, b) => a.startTime - b.startTime);
        const nextFlight = upcomingFlights[0];
        
        nextFlight.el.classList.add('next-flight-highlight');
        
        // Dynamic inject layout components inside headers
        const headerContainer = nextFlight.el.querySelector('.card-header');
        const timeContainer = nextFlight.el.querySelector('.card-time');
        
        const badgeSpan = document.createElement('span');
        badgeSpan.className = 'next-flight-badge';
        badgeSpan.innerHTML = `<i class="ti ti-alert-circle"></i> NEXT FLIGHT`;
        headerContainer.insertBefore(badgeSpan, timeContainer);

        const countdownSpan = document.createElement('span');
        countdownSpan.className = 'countdown-timer';
        headerContainer.insertBefore(countdownSpan, timeContainer);

        function updateTimer() {
          const rem = nextFlight.startTime - Date.now();
          if (rem <= 0) {
            countdownSpan.textContent = "BOARDING / DEPARTED";
            clearInterval(countdownInterval);
          } else {
            const h = Math.floor(rem / 3600000);
            const m = Math.floor((rem % 3600000) / 60000);
            countdownSpan.textContent = `T- ${h}h ${m.toString().padStart(2,'0')}m`;
          }
        }
        updateTimer();
        countdownInterval = setInterval(updateTimer, 60000);
      }
    }

    function renderFiltered() {
      activityList.innerHTML = '';
      const visible = allCards.filter(c => {
        return (currentFilter === 'all' || c.type === currentFilter) && (currentMonthFilter === 'all' || c.month === currentMonthFilter);
      });

      if(!visible.length) {
        activityList.innerHTML = '<div class="empty-state"><p>No operations matched current query limits.</p></div>';
      } else {
        visible.forEach(c => activityList.appendChild(c.el));
      }

      // Update counters blocks
      document.getElementById('statFlights').textContent = allCards.filter(c=>c.type==='flight').length;
      document.getElementById('statDuties').textContent = allCards.filter(c=>c.type==='other').length;
      document.getElementById('statStandby').textContent = allCards.filter(c=>c.type==='standby').length;
      document.getElementById('statTraining').textContent = allCards.filter(c=>c.type==='training').length;

      const totalBlock = visible.reduce((a,c)=>a+c.blockMinutes, 0);
      document.getElementById('totHours').textContent = fmtDuration(totalBlock);
      document.getElementById('totFlights').textContent = visible.filter(c=>c.type==='flight').length;
    }

    function refreshRoster() { initializeRosterSync(); }
  </script>
</body>
</html>
